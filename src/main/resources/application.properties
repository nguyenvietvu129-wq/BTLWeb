spring.application.name=shopdientu

# ================== DATABASE ==================

spring.datasource.url=jdbc:mysql://localhost:3306/shopdientu
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================== JPA / Hibernate ==================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000

# ================== SWAGGER ==================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/v3/api-docs

# ================== JWT ==================

jwt.secret=21321lkaskdfwei3245asd34asd123434589
jwt.expiration-ms=3600000

# ================== GEMINI CHATBOT ==================
# ================== GEMINI CHATBOT ==================

gemini.apiKey=${GEMINI_API_KEY}

gemini.model=gemini-3.6-flash

gemini.apiUrl=https://generativelanguage.googleapis.com/v1/interactions